<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Content Manager - Beyond</title>
<link rel="stylesheet" href="content-manager.css">
</head>
<body>
<header class="cm-header">
  <div><button class="back" onclick="location.href='profile.html'">←</button><div><span class="eyebrow">BEYOND CREATOR STUDIO</span><h1>Content Manager</h1></div></div>
  <button class="upload" onclick="location.href='upload.html'">＋ Upload</button><button class="upload" onclick="location.href='analytics.html'">📊 Analytics</button><button class="upload" onclick="location.href='live-analytics.html'">🔴 Live Analytics</button>
</header>
<main class="cm-main">
  <section class="stats">
    <article><span>Total videos</span><strong id="totalVideos">0</strong></article>
    <article><span>Total views</span><strong id="totalViews">0</strong></article>
    <article><span>Total likes</span><strong id="totalLikes">0</strong></article>
    <article><span>Comments</span><strong id="totalComments">0</strong></article>
  </section>
  <section class="toolbar">
    <div class="tabs"><button class="active" data-filter="all">All</button><button data-filter="published">Published</button><button data-filter="draft">Drafts</button></div>
    <div class="tools"><input id="searchContent" placeholder="Search your videos..."><select id="sortContent"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="likes">Most liked</option></select></div>
  </section>
  <section id="contentList" class="content-list"></section>
  <div id="emptyState" class="empty"><div>🎬</div><h2>No content yet</h2><p>Upload your first Beyond video and manage it here.</p><button onclick="location.href='upload.html'">Upload video</button></div>
</main>
<div id="editModal" class="modal"><div class="modal-card"><button class="close" onclick="closeEditor()">✕</button><span class="eyebrow">EDIT VIDEO</span><h2>Edit content</h2><input id="editCaption" maxlength="150" placeholder="Caption"><input id="editHashtags" maxlength="250" placeholder="#Beyond #ForYou"><div class="modal-actions"><button onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveEditor()">Save changes</button></div></div></div>
<script src="content-manager.js"></script>
</body>
</html>
