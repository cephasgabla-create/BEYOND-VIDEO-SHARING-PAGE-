<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Content Manager - Beyond</title>
<link rel="stylesheet" href="content-manager.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth-guard.js"></script>
</head>
<body>
<header class="cm-header">
  <div><button class="back" onclick="location.href='profile.html'">←</button><div><span class="eyebrow">BEYOND CREATOR STUDIO</span><h1>Content Manager</h1></div></div>
  <div class="header-actions"><button class="upload" onclick="location.href='upload.html'">＋ Upload</button><button class="upload secondary" id="refreshContent">↻ Refresh</button></div><button class="upload" onclick="location.href='analytics.html'">📊 Analytics</button><button class="upload" onclick="location.href='live-analytics.html'">🔴 Live Analytics</button>
</header>
<main class="cm-main">
  <section class="stats">
    <article><span>Total videos</span><strong id="totalVideos">0</strong></article>
    <article><span>Total views</span><strong id="totalViews">0</strong></article>
    <article><span>Total likes</span><strong id="totalLikes">0</strong></article>
    <article><span>Comments</span><strong id="totalComments">0</strong></article>
  </section>
  <section class="toolbar">
    <div class="tabs"><button class="active" data-filter="all">All</button><button data-filter="published">Published</button><button data-filter="draft">Drafts</button></div><select id="mediaTypeFilter" aria-label="Filter by media type"><option value="all">All media</option><option value="video">Videos</option><option value="photo">Photos</option></select>
    <div class="tools"><input id="searchContent" placeholder="Search your videos..."><select id="sortContent"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="likes">Most liked</option></select></div>
  </section>
  <div class="bulk-bar"><label><input type="checkbox" id="selectAll"> Select page</label><span id="selectedCount">0 selected</span><button id="bulkPublish" disabled>Publish selected</button><button id="bulkDraft" disabled>Move to drafts</button><button id="bulkDelete" class="danger" disabled>Delete selected</button></div><section id="contentList" class="content-list"></section><nav class="pagination" aria-label="Content pages"><button id="prevPage" disabled>← Previous</button><span id="pageInfo">Page 1</span><button id="nextPage" disabled>Next →</button></nav>
  <div id="emptyState" class="empty"><div>🎬</div><h2>No content yet</h2><p>Upload your first Beyond video and manage it here.</p><button onclick="location.href='upload.html'">Upload video</button></div>
</main>
<div id="previewModal" class="modal preview-modal"><div class="preview-card"><button class="close" id="closePreview">✕</button><video id="previewVideo" controls playsinline></video><img id="previewImage" alt="Photo preview" hidden><div class="preview-details"><span class="eyebrow">BEYOND VIDEO</span><h2 id="previewTitle">Video preview</h2><p id="previewTags"></p><div id="previewStats"></div></div></div></div>
<div id="editModal" class="modal"><div class="modal-card editor-card"><button class="close" onclick="closeEditor()">✕</button><span class="eyebrow">BEYOND VIDEO EDITOR</span><h2>Edit content</h2><div class="editor-preview"><video id="editVideoPreview" controls playsinline></video><img id="editImagePreview" alt="Photo being edited" hidden></div><label class="field-label" for="editCaption">Caption</label><textarea id="editCaption" maxlength="150" placeholder="Tell people about your video..."></textarea><div class="char-count"><span>Caption</span><span id="captionCount">0 / 150</span></div><label class="field-label" for="editHashtags">Hashtags</label><input id="editHashtags" maxlength="250" placeholder="#Beyond #ForYou"><label class="field-label" for="editVisibility">Visibility</label><select id="editVisibility"><option value="public">Public</option><option value="followers">Followers only</option><option value="private">Private</option></select><label class="toggle-row"><span><strong>Allow comments</strong><small>Let viewers comment on this video.</small></span><input id="editCommentsEnabled" type="checkbox"></label><label class="field-label" for="editStatus">Publishing status</label><select id="editStatus"><option value="published">Published</option><option value="draft">Draft</option></select><div class="modal-actions"><button onclick="closeEditor()">Cancel</button><button class="secondary-action" onclick="saveEditor('draft')">Save draft</button><button class="primary" onclick="saveEditor()">Save changes</button><button class="primary publish-action" onclick="saveEditor('published')">Publish</button></div></div></div>
<script src="content-manager.js"></script>
</body>
</html>
