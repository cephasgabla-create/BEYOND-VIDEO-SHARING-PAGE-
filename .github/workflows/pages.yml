name: Deploy Beyond to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Beyond
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          touch .nojekyll

      - name: Upload Beyond site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Beyond
        id: deployment
        uses: actions/deploy-pages@v4
