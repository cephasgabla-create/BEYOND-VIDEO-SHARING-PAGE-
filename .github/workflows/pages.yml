name: Deploy Beyond to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beyond-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Beyond
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate required Beyond files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            login.html
            signup.html
            profile.html
            upload.html
            search.html
            creator-studio.html
            content-manager.html
            analytics.html
            live-analytics.html
            audience.html
            monetization.html
            notifications.html
            comments-manager.html
            creator-settings.html
            dashboard-customization.html
            database-setup.html
            deployment.html
            404.html
            style.css
            script.js
            supabase.js
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required Beyond file is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0)

      - name: Validate local HTML references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const ignored = /^(?:[a-z][a-z0-9+.-]*:|\/\/|#|data:|blob:|mailto:|tel:|javascript:)/i;
          const missing = new Set();

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.toLowerCase().endsWith('.html')) checkHtml(full);
            }
          }

          function checkHtml(file) {
            const html = fs.readFileSync(file, 'utf8');
            const refs = [];
            const re = /(?:href|src)\s*=\s*["']([^"']+)["']/gi;
            let match;
            while ((match = re.exec(html))) refs.push(match[1].trim());

            for (const ref of refs) {
              if (!ref || ignored.test(ref)) continue;
              const clean = ref.split('#')[0].split('?')[0];
              if (!clean) continue;

              const decoded = decodeURIComponent(clean);
              const base = path.dirname(file);
              const target = path.normalize(path.join(base, decoded));
              if (!fs.existsSync(target)) {
                missing.add(`${file} -> ${ref}`);
              }
            }
          }

          walk('.');
          if (missing.size) {
            for (const item of [...missing].sort()) {
              console.error(`::error::Missing local reference: ${item}`);
            }
            process.exit(1);
          }
          console.log('All local HTML href/src references resolve.');
          const cssFiles = [];
          function walkCss(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walkCss(full);
              else if (entry.isFile() && full.toLowerCase().endsWith('.css')) cssFiles.push(full);
            }
          }
          walkCss('.');
          for (const file of cssFiles) {
            const css = fs.readFileSync(file, 'utf8');
            const urlRe = /url\(\s*["']?([^"')]+)["']?\s*\)/gi;
            let match;
            while ((match = urlRe.exec(css))) {
              const ref = match[1].trim();
              if (!ref || ignored.test(ref)) continue;
              const target = path.normalize(path.join(path.dirname(file), decodeURIComponent(ref.split('#')[0].split('?')[0])));
              if (!fs.existsSync(target)) {
                missing.add(`${file} -> ${ref}`);
              }
            }
          }
          if (missing.size) {
            for (const item of [...missing].sort()) console.error(`::error::Missing local asset reference: ${item}`);
            process.exit(1);
          }
          console.log('All local CSS url() references resolve.');
          NODE

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          touch .nojekyll
          test -f .nojekyll

      - name: Upload Beyond site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Beyond
        id: deployment
        uses: actions/deploy-pages@v4
# Deployment validation: keep all static-site checks enabled.
