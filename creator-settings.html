<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Beyond Creator Settings</title><link rel="stylesheet" href="creator-settings.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body>
<header class="settings-header"><a href="creator-studio.html" class="back">← Creator Studio</a><div><strong>Beyond</strong><span>Creator Settings</span></div><button id="saveTop">Save Changes</button></header>
<main class="settings-shell"><section class="intro"><p class="eyebrow">CREATOR STUDIO</p><h1>Settings & Preferences</h1><p>Control how your Beyond creator experience works.</p><div id="status" class="status" aria-live="polite"></div></section>
<form id="settingsForm">
<section class="settings-card"><h2>Privacy</h2><label class="toggle-row"><span><b>Private account</b><small>Only approved followers can view your content.</small></span><input type="checkbox" id="privateAccount"></label><label class="toggle-row"><span><b>Activity status</b><small>Let people see when you are active.</small></span><input type="checkbox" id="activityStatus"></label><label class="toggle-row"><span><b>Personalized recommendations</b><small>Use your activity to improve your Beyond feed.</small></span><input type="checkbox" id="recommendations"></label></section>
<section class="settings-card"><h2>Comments</h2><label><span>Who can comment</span><select id="commentAccess"><option value="everyone">Everyone</option><option value="followers">Followers</option><option value="following">People you follow</option><option value="off">No one</option></select></label><label class="toggle-row"><span><b>Filter potentially unwanted comments</b><small>Keep common spam patterns out of your main view.</small></span><input type="checkbox" id="commentFilter"></label><label class="toggle-row"><span><b>Allow replies</b><small>Let people reply to comments on your videos.</small></span><input type="checkbox" id="allowReplies"></label></section>
<section class="settings-card"><h2>Notifications</h2><label class="toggle-row"><span><b>Likes</b><small>Notify me about likes on my videos.</small></span><input type="checkbox" id="notifyLikes"></label><label class="toggle-row"><span><b>Comments</b><small>Notify me when someone comments.</small></span><input type="checkbox" id="notifyComments"></label><label class="toggle-row"><span><b>Followers</b><small>Notify me about new followers.</small></span><input type="checkbox" id="notifyFollowers"></label><label class="toggle-row"><span><b>Live activity</b><small>Notify me about activity around live sessions.</small></span><input type="checkbox" id="notifyLive"></label></section>
<section class="settings-card"><h2>Content Defaults</h2><label><span>Default visibility</span><select id="defaultVisibility"><option value="public">Public</option><option value="followers">Followers</option><option value="private">Only me</option></select></label><label><span>Default comment access</span><select id="defaultComments"><option value="everyone">Everyone</option><option value="followers">Followers</option><option value="following">People you follow</option><option value="off">No one</option></select></label><label><span>Default caption language</span><select id="captionLanguage"><option value="auto">Auto-detect</option><option value="en">English</option><option value="fr">French</option><option value="tw">Twi</option></select></label></section>
<section class="settings-card"><h2>Appearance</h2><label><span>Theme</span><select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></label><label class="toggle-row"><span><b>Compact Creator Studio</b><small>Use tighter spacing on dashboards and management pages.</small></span><input type="checkbox" id="compactMode"></label></section>
<section class="settings-card"><h2>Live</h2><label class="toggle-row"><span><b>Save live session history</b><small>Keep local live session statistics available in Live Analytics.</small></span><input type="checkbox" id="saveLiveHistory"></label><label><span>Default live audience</span><select id="liveAudience"><option value="public">Public</option><option value="followers">Followers</option></select></label></section>
<div class="actions"><button type="button" id="resetBtn" class="secondary">Reset Defaults</button><button type="submit" class="primary">Save Settings</button></div>
</form></main><script src="creator-settings.js"></script></body></html>
