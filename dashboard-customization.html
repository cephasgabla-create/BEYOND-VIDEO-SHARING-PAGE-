<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond Dashboard Customization</title><link rel="stylesheet" href="dashboard-customization.css"></head><body><header><a href="creator-studio.html">← Creator Studio</a><strong>Beyond · Dashboard Customization</strong><button id="saveTop">Save</button></header><main><section class="intro"><small>CREATOR STUDIO</small><h1>Customize your dashboard</h1><p>Choose which Creator Studio sections appear and how your dashboard is organized.</p><div id="status"></div></section><form id="form"><section class="card"><h2>Dashboard layout</h2><label>Density<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label>Tool columns<select id="columns"><option value="2">2 columns</option><option value="1">1 column</option></select></label><label class="check"><span>Show quick insights</span><input type="checkbox" id="insights"></label><label class="check"><span>Show recent content</span><input type="checkbox" id="recent"></label></section><section class="card"><h2>Creator Studio tools</h2><div id="tools"></div></section><section class="card"><h2>Dashboard behavior</h2><label class="check"><span>Remember my dashboard settings</span><input type="checkbox" id="remember"></label><label class="check"><span>Open Creator Studio with the latest content first</span><input type="checkbox" id="latest"></label></section><div class="actions"><button type="button" id="reset" class="secondary">Reset</button><button class="primary">Save Customization</button></div></form></main><script src="dashboard-customization.js"></script></body></html>
