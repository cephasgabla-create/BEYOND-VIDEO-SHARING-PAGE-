<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b0b0d"><title>Log In - Beyond</title><link rel="stylesheet" href="login.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head>
<body><main class="auth-page"><section class="auth-card" aria-labelledby="loginTitle">
<a class="brand" href="index.html" aria-label="Beyond home">Beyond</a><h1 id="loginTitle">Welcome back</h1><p class="subtitle">Log in to continue creating and discovering.</p>
<form id="loginForm" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
<label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="showPassword" type="button" aria-pressed="false">Show</button></div>
<div class="form-row"><label class="check"><input id="remember" type="checkbox" checked><span>Remember me</span></label><a id="forgotPassword" class="forgot" href="#">Forgot password?</a></div>
<p id="loginMessage" class="message" aria-live="polite" role="status"></p><button id="loginButton" class="submit" type="submit">Log in</button>
</form><p class="switch">New to Beyond? <a href="signup.html">Create an account</a></p><a class="back" href="index.html">← Back to Beyond</a>
</section></main><script src="login.js"></script></body></html>
