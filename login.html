<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log In - Beyond</title>
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<a class="brand" href="index.html">Beyond</a>
<h1>Welcome back</h1><p class="subtitle">Log in to continue creating and discovering.</p>
<form id="loginForm" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required>
<label class="check"><input id="remember" type="checkbox" checked> <span>Remember me</span></label>
<p id="loginMessage" class="message" aria-live="polite"></p>
<button id="loginButton" type="submit">Log in</button>
</form>
<p class="switch">New to Beyond? <a href="signup.html">Create an account</a></p>
<a class="back" href="index.html">← Back to Beyond</a>
</section>
</main>
<script src="login.js"></script>
</body>
</html>
