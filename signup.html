<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign Up - Beyond</title><link rel="stylesheet" href="signup.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
</head>
<body><main class="auth-page"><section class="auth-card">
<a class="brand" href="index.html">Beyond</a><h1>Create your account</h1><p class="subtitle">Join Beyond and start sharing your moments.</p>
<form id="signupForm" novalidate>
<label for="username">Username</label><input id="username" type="text" minlength="3" maxlength="30" autocomplete="username" placeholder="yourname" required>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required>
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
<p id="signupMessage" class="message" aria-live="polite"></p><button id="signupButton" type="submit">Create account</button>
</form><p class="switch">Already have an account? <a href="login.html">Log in</a></p><a class="back" href="index.html">← Back to Beyond</a>
</section></main><script src="signup.js"></script></body></html>
