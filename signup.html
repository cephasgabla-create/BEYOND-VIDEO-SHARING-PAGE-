<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b0b0d"><title>Sign Up - Beyond</title><link rel="stylesheet" href="signup.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head>
<body><main class="auth-page"><section class="auth-card" aria-labelledby="signupTitle">
<a class="brand" href="index.html" aria-label="Beyond home">Beyond</a><h1 id="signupTitle">Create your account</h1><p class="subtitle">Join Beyond and start sharing your moments.</p>
<form id="signupForm" novalidate>
<label for="username">Username</label><input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="yourname" required><small class="hint">3–30 characters: letters, numbers, dots, underscores or hyphens.</small>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
<label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle="password" aria-pressed="false">Show</button></div><small class="hint">Use at least 8 characters.</small>
<label for="confirmPassword">Confirm password</label><div class="password-wrap"><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle="confirmPassword" aria-pressed="false">Show</button></div>
<p id="signupMessage" class="message" aria-live="polite" role="status"></p><button id="signupButton" class="submit" type="submit">Create account</button>
</form><p class="switch">Already have an account? <a href="login.html">Log in</a></p><a class="back" href="index.html">← Back to Beyond</a>
</section></main><script src="signup.js"></script></body></html>
