<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Beyond</title><link rel="stylesheet" href="login.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head>
<body><main class="auth"><h1>Beyond</h1><h2>Create account</h2>
<form id="signupForm">
<input id="username" type="text" placeholder="Username" minlength="3" maxlength="30" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
<input id="confirmPassword" type="password" placeholder="Confirm password" minlength="6" required>
<p id="signupMessage" aria-live="polite"></p><button type="submit">Create account</button>
</form><p>Already have an account? <a href="login.html">Log in</a></p><p><a href="index.html">← Back to Beyond Home</a></p></main><script src="signup.js"></script></body></html>
