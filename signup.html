<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - Beyond</title><link rel="stylesheet" href="login.css"></head><body><main class="auth"><h1>Beyond</h1><h2>Create account</h2><form id="signupForm"><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="6" placeholder="Password" required><button>Create account</button></form><p>Already have an account? <a href="login.html">Log in</a></p></main><script>document.getElementById("signupForm").onsubmit=function(e){e.preventDefault();localStorage.setItem("beyondUsername",document.getElementById("username").value.replace(/^@/,""));localStorage.setItem("beyondEmail",document.getElementById("email").value);localStorage.setItem("beyondLoggedIn","true");location.href="index.html"}</script></body></html>
