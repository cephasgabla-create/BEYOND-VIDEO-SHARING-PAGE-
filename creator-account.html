<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Beyond Account & Profile</title><link rel="stylesheet" href="creator-account.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth-guard.js"></script></head><body>
<header><a href="creator-studio.html" class="back">← Creator Studio</a><div class="brand"><strong>Beyond</strong><span>Account & Profile</span></div><button id="saveTop">Save Changes</button></header>
<main><section class="intro"><p>CREATOR STUDIO</p><h1>Account & Profile</h1><span>Manage the information people see on your Beyond creator profile.</span><div id="status" aria-live="polite"></div></section>
<form id="accountForm">
<section class="card"><h2>Account</h2><label><span>Email</span><input id="email" type="email" readonly><small>Your sign-in email is shown here for reference.</small></label><label><span>Username</span><input id="username" maxlength="30" required placeholder="BeyondCreator"><small>Your unique Beyond profile name.</small></label><label><span>Display name</span><input id="displayName" maxlength="50" required placeholder="Beyond Creator"></label></section>
<section class="card"><h2>Profile</h2><label><span>Bio <small id="bioCount">0/80</small></span><textarea id="bio" maxlength="80" rows="3" placeholder="Tell people about your creator profile"></textarea></label><label><span>Avatar URL</span><input id="avatarUrl" type="url" placeholder="https://..."></label><label><span>Banner URL</span><input id="bannerUrl" type="url" placeholder="https://..."></label><label><span>Profile accent</span><div class="color-row"><input id="accent" type="color" value="#ff2d55"><code id="accentValue">#ff2d55</code></div></label></section>
<section class="card preview"><h2>Preview</h2><div id="previewBanner" class="banner"></div><div class="preview-body"><div id="previewAvatar" class="avatar">B</div><div><strong id="previewName">Beyond Creator</strong><span id="previewUsername">@BeyondCreator</span><p id="previewBio">Welcome to my Beyond profile 🚀</p></div></div></section>
<div class="actions"><button type="button" id="resetBtn" class="secondary">Reset</button><button type="submit" class="primary">Save Profile</button></div></form></main><script src="creator-account.js"></script></body></html>
