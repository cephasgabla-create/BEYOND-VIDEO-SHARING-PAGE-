<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Beyond - Privacy & Safety</title><link rel="stylesheet" href="privacy-safety.css"></head>
<body><main class="page"><header><a href="creator-studio.html">← Creator Studio</a><p>Beyond Creator Studio</p><h1>Privacy & Safety</h1><span>Control your Beyond privacy and safety preferences.</span></header>
<section class="grid">
<article class="card"><h2>Account privacy</h2><label><span><strong>Private account</strong><small>Control who can access follower-only content.</small></span><input id="privateAccount" type="checkbox"></label><label><span><strong>Activity status</strong><small>Show your activity status to eligible people.</small></span><input id="activityStatus" type="checkbox"></label></article>
<article class="card"><h2>Content safety</h2><label><span><strong>Comment filtering</strong><small>Use your saved comment-filtering preference.</small></span><input id="commentFilter" type="checkbox"></label><label><span><strong>Review tagged content</strong><small>Review tagged content before it appears on your profile.</small></span><input id="tagReview" type="checkbox"></label></article>
<article class="card"><h2>Personalization</h2><label><span><strong>Personalized recommendations</strong><small>Use your activity to improve recommendations.</small></span><input id="recommendations" type="checkbox"></label><label><span><strong>Personalized notifications</strong><small>Allow tailored notification preferences.</small></span><input id="personalizedNotifications" type="checkbox"></label></article>
<article class="card"><h2>Blocked users</h2><div id="blockedUsers" class="blocked-list"><p>Loading blocked users…</p></div></article><article class="card"><h2>Data controls</h2><button id="clearPrefs" type="button">Reset privacy settings</button><p id="message"></p></article>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth-guard.js"></script><script src="privacy-safety.js"></script></body></html>
