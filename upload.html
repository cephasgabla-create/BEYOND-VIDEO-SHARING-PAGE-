<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload - Beyond</title><link rel="stylesheet" href="upload.css"></head><body><main class="upload"><h1>Upload to Beyond</h1><input id="videoInput" type="file" accept="video/*"><video id="preview" controls></video><textarea id="caption" maxlength="150" placeholder="Caption"></textarea><input id="hashtags" placeholder="#Beyond #ForYou"><button onclick="publishVideo()">Post</button><button onclick="location.href='index.html'">Back</button></main><script src="upload.js"></script><div id="goLiveModal" class="golive-modal"><div class="golive-card"><button class="golive-close" onclick="closeGoLive()">✕</button><span class="eyebrow">BEYOND LIVE</span><h2>Start a Live</h2><p>Set up your live room before you go on air.</p><label>Live title</label><input id="liveTitleInput" maxlength="80" placeholder="What are you going live about?"><label>Category</label><select id="liveCategory"><option>Just Chatting</option><option>Music</option><option>Gaming</option><option>Sports</option><option>Creative</option></select><label class="check-row"><input type="checkbox" id="liveChatEnabled" checked> Enable live chat</label><button class="start-live-btn" onclick="startConfiguredLive()">🔴 Start Live</button></div></div></body></html>
