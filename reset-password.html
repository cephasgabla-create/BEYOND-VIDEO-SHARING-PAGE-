<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - Beyond</title><link rel="stylesheet" href="login.css"></head><body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html">Beyond</a><h1>Reset password</h1><p class="subtitle">Choose a new password for your Beyond account.</p><form id="resetForm" novalidate><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><label class="check"><input id="showPassword" type="checkbox"> <span>Show passwords</span></label><p id="resetMessage" class="message" aria-live="polite"></p><button id="resetButton" type="submit">Update password</button></form><p class="switch"><a href="login.html">Back to Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="reset-password.js"></script></body></html>
